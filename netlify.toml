[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Private parent links: keep the token out of Referer headers, search engines and caches.
[[headers]]
  for = "/pay/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/parent/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/book/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
